name: lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff (same commands as CLAUDE.md)
        run: |
          uvx ruff@0.16.6 check .
          uvx ruff@0.16.6 format --check expansion genai tests benchmarks
